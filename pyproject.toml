[project]
name = "telemachus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Baltasar" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=0.36.2",
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "numpy<2",
    "sentence-transformers==3.4.1",
    "torch==2.2.2",
    "transformers==4.49.0",
    "typing>=3.10.0.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.16.4",
]
